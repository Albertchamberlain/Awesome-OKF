<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Background: warm knowledge gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="doc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="62" fill="url(#bg)"/>

  <!-- Knowledge graph nodes (OKF links) -->
  <line x1="20" y1="28" x2="44" y2="52" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="108" y1="20" x2="84" y2="48" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="20" y1="104" x2="44" y2="80" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="108" y1="108" x2="84" y2="84" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <circle cx="20" cy="28" r="6" fill="#a5b4fc" opacity="0.9"/>
  <circle cx="108" cy="20" r="6" fill="#a5b4fc" opacity="0.9"/>
  <circle cx="20" cy="104" r="6" fill="#a5b4fc" opacity="0.9"/>
  <circle cx="108" cy="108" r="6" fill="#a5b4fc" opacity="0.9"/>

  <!-- Document: Markdown file symbol -->
  <rect x="40" y="36" width="48" height="56" rx="6" fill="url(#doc)" stroke="#4f46e5" stroke-width="1.5"/>

  <!-- YAML frontmatter markers -->
  <line x1="49" y1="48" x2="79" y2="48" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="49" y1="55" x2="73" y2="55" stroke="#c7d2fe" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="49" y1="62" x2="75" y2="62" stroke="#c7d2fe" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Separator: YAML to body -->
  <line x1="49" y1="70" x2="79" y2="70" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>

  <!-- Markdown body text -->
  <line x1="49" y1="78" x2="78" y2="78" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
  <line x1="49" y1="85" x2="71" y2="85" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
</svg>
