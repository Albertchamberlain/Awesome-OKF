name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Validate catalog
        run: awesome-okf validate

      - name: Run tests
        run: pytest -q

      - name: Regenerate README
        run: awesome-okf readme

      - name: Check README sync
        run: git diff --exit-code README.md

  clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clean editable install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
          .venv/bin/awesome-okf stats
          .venv/bin/python -c "import awesome_okf.server"
          .venv/bin/pytest -q
